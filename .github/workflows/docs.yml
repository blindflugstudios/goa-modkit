name: Publish docs

# main holds the docs of the current public game version (DOCS_VERSION, alias "latest").
# next holds the docs for the public beta (alias "next"). Older versions stay frozen on
# the gh-pages branch; mike never rebuilds them.

on:
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy current version
        if: github.ref == 'refs/heads/main'
        run: |
          mike deploy --push --update-aliases "$(cat DOCS_VERSION)" latest
          mike set-default --push latest
      - name: Deploy beta docs
        if: github.ref == 'refs/heads/next'
        run: mike deploy --push next
